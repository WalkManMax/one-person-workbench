<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="工作台">
  <meta name="theme-color" content="#F5F5F7">
  <title>一人公司工作台</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">

    <!-- ========== 屏1：考勤登记 ========== -->
    <section class="screen active" id="screen-attendance">
      <header class="page-header">
        <h1>考勤登记</h1>
        <p class="subtitle">2026年8月 · 每日记录与小结</p>
      </header>
      <div class="content">

        <!-- 今天要处理 -->
        <div id="attendance-today-banner" class="today-banner hidden"></div>

        <!-- 工具栏 -->
        <div class="toolbar">
          <button class="btn-primary" onclick="openAttendanceForm()">＋ 添加今日记录</button>
          <div class="toolbar-right">
            <button class="btn-ghost" onclick="exportJSON()" title="导出备份">导出</button>
            <label class="btn-ghost" title="导入恢复">导入<input type="file" accept="application/json" onchange="importJSON(event)" hidden></label>
          </div>
        </div>

        <!-- 统计 -->
        <div class="stat-grid" id="attendance-stats"></div>

        <!-- 今日状态快选 -->
        <div class="card">
          <h3 class="card-title">今日状态</h3>
          <div class="pill-row" id="attendance-status-pills"></div>
        </div>

        <!-- 记录列表（JS 渲染） -->
        <div id="attendance-list" class="record-list"></div>

      </div>
    </section>

    <!-- ========== 屏2：AI资讯 ========== -->
    <section class="screen" id="screen-news">
      <header class="page-header">
        <h1>AI资讯</h1>
        <p class="subtitle">今日精选 · 关键信息结构化呈现</p>
      </header>
      <div class="content">

        <div class="toolbar">
          <div class="pill-row filter-row" id="news-filters"></div>
          <div class="toolbar-right">
            <button class="btn-ghost" onclick="refreshNews()">刷新</button>
            <button class="btn-ghost" onclick="openNewsForm()">＋</button>
          </div>
        </div>

        <div class="stat-line">
          <span id="news-count">0 条</span>
          <span class="dot-sep">·</span>
          <span id="news-starred-count">已收藏 0 条</span>
        </div>

        <div id="news-list" class="record-list"></div>

        <div class="card">
          <h3 class="card-title">今日要点</h3>
          <div id="news-keypoints"></div>
        </div>

      </div>
    </section>

    <!-- ========== 屏3：抖音热榜 ========== -->
    <section class="screen" id="screen-hotlist">
      <header class="page-header">
        <h1>抖音热榜</h1>
        <p class="subtitle">实时榜单 · 自动生成选题建议</p>
      </header>
      <div class="content">

        <div class="toolbar">
          <span class="toolbar-title">实时热榜</span>
          <div class="toolbar-right">
            <button class="btn-ghost" onclick="refreshHotlist()">刷新榜单</button>
          </div>
        </div>

        <div class="card list-card">
          <div class="list-header">
            <h3 class="card-title">TOP <span id="hotlist-count">0</span></h3>
            <span class="list-updated" id="hotlist-updated">—</span>
          </div>
          <div id="hotlist-rows"></div>
        </div>

        <div class="toolbar">
          <span class="toolbar-title">选题建议</span>
          <span class="stat-line" id="topic-adopted-count">已采纳 0</span>
        </div>

        <div id="topic-list" class="record-list"></div>

      </div>
    </section>

    <!-- ========== 屏4：健身打卡 ========== -->
    <section class="screen" id="screen-fitness">
      <header class="page-header">
        <h1>健身打卡</h1>
        <p class="subtitle">今日运动与饮水 · 汇总自动推送飞书</p>
      </header>
      <div class="content">

        <div id="fitness-today-banner" class="today-banner hidden"></div>

        <div class="stat-grid" id="fitness-stats"></div>

        <!-- 喝水 -->
        <div class="card">
          <div class="list-header">
            <h3 class="card-title">喝水提醒</h3>
            <span class="list-updated" id="water-text">—</span>
          </div>
          <div class="progress-track"><div class="progress-fill" id="water-fill" style="width:0%"></div></div>
          <div class="counter-row">
            <button class="btn-round" onclick="waterAdd(-1)">−</button>
            <span class="counter-value" id="water-value">0/8杯</span>
            <button class="btn-round primary" onclick="waterAdd(1)">＋</button>
          </div>
        </div>

        <!-- 本周打卡 -->
        <div class="card">
          <div class="list-header">
            <h3 class="card-title">本周打卡</h3>
            <span class="list-updated" id="week-text">已完成 0/7</span>
          </div>
          <div class="week-row" id="week-dots"></div>
          <button class="btn-text" onclick="toggleTodayCheckin()" id="today-checkin-btn">标记今日已打卡</button>
        </div>

        <!-- 训练 -->
        <div class="card">
          <div class="list-header">
            <h3 class="card-title">今日训练</h3>
            <button class="btn-ghost small" onclick="openExerciseForm()">＋ 添加动作</button>
          </div>
          <div id="exercise-list"></div>
          <div class="kcal-row">
            <span class="kcal-label">本次消耗</span>
            <input type="number" class="kcal-input" id="kcal-input" min="0" step="10" onchange="updateKcal(this.value)">
            <span class="kcal-unit">千卡</span>
          </div>
        </div>

        <!-- 飞书推送 -->
        <div class="card toggle-card">
          <div class="toggle-info">
            <h3 class="card-title">飞书每日汇总</h3>
            <p class="toggle-desc">每天 21:00 推送打卡与饮水记录</p>
          </div>
          <div class="switch" id="push-switch" onclick="togglePush()"><div class="knob"></div></div>
        </div>

      </div>
    </section>

    <!-- ========== 底部标签栏 ========== -->
    <nav class="tab-bar">
      <button class="tab-item active" data-target="screen-attendance" onclick="switchTab('screen-attendance', this)">
        <svg viewBox="0 0 24 24" fill="none"><path d="M7 4C10.3 4 13.6 4 17 4C18.7 4 20 5.3 20 7C20 10.3 20 13.6 20 17C20 18.7 18.7 20 17 20C13.6 20 10.3 20 7 20C5.3 20 4 18.7 4 17C4 13.6 4 10.3 4 7C4 5.3 5.3 4 7 4Z M4 10C9.3 10 14.6 10 20 10 M8 3C8 4.3 8 5.6 8 7 M16 3C16 4.3 16 5.6 16 7" stroke="currentColor" stroke-width="2"/></svg>
        <span>考勤</span>
      </button>
      <button class="tab-item" data-target="screen-news" onclick="switchTab('screen-news', this)">
        <svg viewBox="0 0 24 24" fill="none"><path d="M5 4C9.6 4 14.3 4 19 4C20.1 4 21 4.9 21 6C21 10 21 14 21 18C21 19.1 20.1 20 19 20C14.3 20 9.6 20 5 20C3.9 20 3 19.1 3 18C3 14 3 10 3 6C3 4.9 3.9 4 5 4Z M7 9C10.3 9 13.6 9 17 9 M7 13C10.3 13 13.6 13 17 13 M7 17C9 17 11 17 13 17" stroke="currentColor" stroke-width="2"/></svg>
        <span>AI资讯</span>
      </button>
      <button class="tab-item" data-target="screen-hotlist" onclick="switchTab('screen-hotlist', this)">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 3C12 3 6 8 6 13C6 16.3 8.7 19 12 19C15.3 19 18 16.3 18 13C18 8 12 3 12 3Z M10 15C10 16.1 10.9 17 12 17C13.1 17 14 16.1 14 15C14 13.5 12 12 12 12C12 12 10 13.5 10 15Z" stroke="currentColor" stroke-width="2"/></svg>
        <span>热榜</span>
      </button>
      <button class="tab-item" data-target="screen-fitness" onclick="switchTab('screen-fitness', this)">
        <svg viewBox="0 0 24 24" fill="none"><path d="M7 9C7 11 7 13 7 15 M17 9C17 11 17 13 17 15 M4 10C4 11.3 4 12.6 4 14 M20 10C20 11.3 20 12.6 20 14 M7 12C10.3 12 13.6 12 17 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>健身</span>
      </button>
    </nav>

  </div>

  <!-- ========== 通用模态框（编辑表单） ========== -->
  <div id="modal-overlay" class="modal-overlay hidden" onclick="closeModal(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h2 id="modal-title">编辑</h2>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer">
        <button class="btn-ghost" onclick="closeModal()">取消</button>
        <button class="btn-primary" id="modal-save">保存</button>
      </div>
    </div>
  </div>

  <!-- ========== Toast 提示 ========== -->
  <div id="toast" class="toast hidden"></div>

  <script src="js/app.js"></script>
</body>
</html>
